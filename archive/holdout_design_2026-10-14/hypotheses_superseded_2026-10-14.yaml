# Pre-specified hypotheses and success criteria.
# Fix this file BEFORE running any experiment from Phase C onward.
# Phase C code refuses to run statistical comparisons unless status is "locked".
# Changing it after seeing results must be reported as a deviation in the thesis.
# Text in success_criterion is documentation only. Only the structured keys decide.

status: locked
locked_on: 2026-10-14

alpha: 0.05
multiple_comparison_correction: holm
holm_family: per_hypothesis            # sensitivity check: all_primary_superiority
paired_test: corrected_resampled_t
effect_size: paired_dz
decision_setup: primary
ablation_tuning: retune                # same Optuna trial budget for every variant
primary_hypotheses: [H3_anemia_screening, H5_ced_classification]

hypotheses:
  H1_hb_regression:
    statement: "XGBRegressor predicts Hb with lower MAE than DummyRegressor (mean) under repeated CV."
    metric: mae
    comparator: dummy_mean
    direction: lower
    success_criterion: "p < alpha after correction and MAE reduction >= 0.10 g/dL"
    min_meaningful_difference: 0.10

  H2_hb_vs_baselines:
    statement: "XGBRegressor MAE is lower than Ridge, Decision Tree, and Random Forest."
    metric: mae
    comparator: [ridge, decision_tree, random_forest]
    direction: lower
    success_criterion: "p < alpha after correction and MAE reduction >= 0.05 g/dL"
    min_meaningful_difference: 0.05

  H3_anemia_screening:
    statement: "Binary anemia (Hb < 11) derived from predicted Hb reaches useful screening performance on the hold-out set."
    metric: [sensitivity, specificity, auc_roc]
    operating_point: "cutoff on predicted Hb chosen on out-of-fold training predictions to reach min_sensitivity, applied once to the hold-out"
    success_criterion: "AUC-ROC lower 95% CI bound above 0.5, sensitivity >= 0.70, specificity >= 0.40"
    min_sensitivity: 0.70
    min_specificity: 0.40

  H4_regression_vs_direct:
    statement: "Regression-then-threshold is not worse than a direct XGBClassifier for binary anemia."
    metric: auc_roc
    comparator: direct_xgb_classifier
    direction: not_worse
    evaluation: cv
    ci_level: two_sided_90
    non_inferiority_margin: 0.10

  H5_ced_classification:
    statement: "XGBClassifier for CED risk has higher AUC-ROC than DummyClassifier (prior) and Logistic Regression."
    metric: auc_roc
    comparator: [dummy_prior, logistic_regression]
    direction: higher
    success_criterion: "p < alpha after correction, AUC-ROC >= 0.70 on hold-out, AUC CI lower bound >= 0.50, gain over Logistic Regression >= 0.03"
    min_auc: 0.70
    auc_ci_lower_min: 0.50
    min_meaningful_difference: 0.03

  H6_resampling_ced:
    statement: "SMOTENC or scale_pos_weight improves CED PR-AUC over no resampling."
    metric: pr_auc
    comparator: [smotenc, scale_pos_weight]
    pass_rule: any
    direction: higher
    success_criterion: "p < alpha after correction and PR-AUC gain >= 0.02"
    min_meaningful_difference: 0.02

  H7_resampling_hb:
    statement: "SMOGN reduces MAE on Hb values below 11 g/dL compared with no resampling."
    metric: mae_hb_below_11
    comparator: no_resampling
    direction: lower
    evaluation: pooled_out_of_fold
    success_criterion: "p < alpha after correction and MAE reduction >= 0.10 g/dL"
    min_meaningful_difference: 0.10

  H8_hb_interval_coverage:
    statement: "Conformal prediction intervals for Hb reach close to nominal coverage on the hold-out."
    metric: empirical_coverage
    nominal: 0.90
    success_criterion: "coverage between 0.85 and 0.95"
    coverage_min: 0.85
    coverage_max: 0.95